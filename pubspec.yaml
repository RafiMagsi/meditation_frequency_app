name: meditation_frequency_app
description: DropTicks AI demo - premium meditation & frequency app.
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.3
  flutter_tts: ^4.2.5
  just_audio: ^0.9.34
  record: ^6.2.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/images/cards/
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand.ttf
