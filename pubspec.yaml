
name: meditation_frequency_app
description: Full-featured Flutter project for Meditation & Frequency app.
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.3
  just_audio: ^0.9.34
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_sound: ^9.2.13
  mic_stream: ^0.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
