name: meditation_frequency_app
description: DropTicks AI demo - premium meditation & frequency app.
version: 1.0.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.3
  flutter_tts: ^4.2.5
  just_audio: ^0.9.34
  record: ^6.2.1
  shared_preferences: ^2.5.6
  speech_to_text: ^7.4.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - assets/images/cards/
    - assets/videos/
  fonts:
    # Inter (SIL Open Font License, see assets/fonts/inter/OFL.txt):
    # static weights so every weight renders crisply.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    # Inter Display: the same design cut for large sizes.
    - family: InterDisplay
      fonts:
        - asset: assets/fonts/inter/InterDisplay-Regular.ttf
        - asset: assets/fonts/inter/InterDisplay-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/InterDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/InterDisplay-Bold.ttf
          weight: 700
